# games.secretagents.com - one site for all the games, each under its own path.
# Copy to /etc/nginx/sites-available/games, link into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d games.secretagents.com
#
# Only each game's Client folder is served. Never point root at /opt/games,
# or Server/.env would be downloadable.
server {
	listen 80;
	server_name games.secretagents.com;

	# Until there is a games home page, send visitors to Crossdoku.
	location = / {
		return 302 /crossdoku/;
	}

	# ---- Crossdoku (API on port 9010) ----
	location = /crossdoku {
		return 301 /crossdoku/;
	}
	location /crossdoku/api/ {
		proxy_pass http://127.0.0.1:9010/api/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 150s;   # puzzle generation can take about a minute
	}
	location /crossdoku/ {
		alias /opt/games/crossdoku/Client/;
		index index.html;
	}

	# ---- Next game: copy the three blocks above, change the path and give it its own port ----
}

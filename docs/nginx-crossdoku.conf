# Copy to /etc/nginx/sites-available/crossdoku, link into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS with: sudo certbot --nginx -d crossdoku.example.com
server {
	listen 80;
	server_name crossdoku.example.com;   # change to your subdomain

	root /opt/crossdoku/Client;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:9010;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 150s;   # puzzle generation can take about a minute
	}
}
